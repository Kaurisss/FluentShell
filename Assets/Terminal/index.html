<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="xterm.css">
    <style>
        html, body, #terminal {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #FEFEFE;
            box-sizing: border-box;
            padding: 12px;
        }

        #terminal {
            outline: none;
        }
        #search { position: fixed; right: 16px; top: 16px; z-index: 2; padding: 8px; background: Canvas; color: CanvasText; border: 1px solid GrayText; }
    </style>
</head>
<body>
    <div id="terminal" aria-label="SSH 终端"></div>
    <div id="search" hidden><input id="search-input" aria-label="查找终端内容"><button id="search-next">下一个</button><button id="search-close">关闭</button></div>
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script src="addon-search.js"></script>
    <script>
        (() => {
            const themes = {
                light: {
                    background: '#FEFEFE', foreground: '#17212B',
                    cursor: '#17212B', cursorAccent: '#FEFEFE',
                    selectionBackground: '#BDD8F5',
                    black: '#24292F', red: '#B42318', green: '#216E39', yellow: '#805500',
                    blue: '#0550AE', magenta: '#7446C8', cyan: '#076678', white: '#59636E',
                    brightBlack: '#57606A', brightRed: '#CF222E', brightGreen: '#187632', brightYellow: '#8C5D00',
                    brightBlue: '#0969DA', brightMagenta: '#A03AAF', brightCyan: '#076F7C', brightWhite: '#616B75'
                },
                dark: {
                    background: '#363636', foreground: '#E6EDF3',
                    cursor: '#E6EDF3', cursorAccent: '#363636',
                    selectionBackground: 'rgba(120, 170, 255, 0.35)',
                    black: '#24292F', red: '#FF7B72', green: '#7EE787', yellow: '#E3B341',
                    blue: '#79C0FF', magenta: '#D2A8FF', cyan: '#76E3EA', white: '#D0D7DE',
                    brightBlack: '#9DA7B3', brightRed: '#FFA198', brightGreen: '#AFF5B4', brightYellow: '#F8E3A1',
                    brightBlue: '#A5D6FF', brightMagenta: '#E2C5FF', brightCyan: '#B3F0FF', brightWhite: '#FFFFFF'
                }
            };
            const terminal = new Terminal({
                allowProposedApi: true,
                convertEol: false,
                cursorBlink: true,
                cursorStyle: 'bar',
                fontFamily: 'Cascadia Mono, Consolas, monospace',
                fontSize: 14,
                scrollback: 20000,
                theme: themes.light
            });
            const fitAddon = new FitAddon.FitAddon();
            terminal.loadAddon(fitAddon);
            terminal.open(document.getElementById('terminal'));

            const searchAddon = new SearchAddon.SearchAddon();
            terminal.loadAddon(searchAddon);
            let preferences = { copyOnSelect: false, rightClickPaste: false, shortcuts: {} };
            const showSearch = () => { document.getElementById('search').hidden = false; document.getElementById('search-input').focus(); };
            const find = () => searchAddon.findNext(document.getElementById('search-input').value);
            document.getElementById('search-next').addEventListener('click', find);
            document.getElementById('search-close').addEventListener('click', () => { document.getElementById('search').hidden = true; terminal.focus(); });
            document.getElementById('search-input').addEventListener('keydown', e => {
                if (e.key === 'Enter') find();
                if (e.key === 'Escape') { document.getElementById('search').hidden = true; terminal.focus(); }
            });
            terminal.attachCustomKeyEventHandler(e => {
                if (e.ctrlKey && e.shiftKey && !e.altKey) {
                    const action = Object.keys(preferences.shortcuts).find(action => preferences.shortcuts[action] === e.key.toUpperCase());
                    if (action) {
                        if (e.type === 'keydown') post({ type: 'shortcut', action });
                        e.preventDefault();
                        return false;
                    }
                }
                return true;
            });
            document.getElementById('terminal').addEventListener('paste', e => {
                e.preventDefault(); e.stopImmediatePropagation();
                post({ type: 'paste', data: e.clipboardData.getData('text/plain') });
            }, true);
            document.getElementById('terminal').addEventListener('contextmenu', e => {
                if (preferences.rightClickPaste) { e.preventDefault(); post({ type: 'paste' }); }
            });
            terminal.onSelectionChange(() => {
                if (preferences.copyOnSelect && terminal.hasSelection()) post({ type: 'copy', data: terminal.getSelection() });
            });

            const post = message => window.chrome.webview.postMessage(message);
            const fit = () => {
                try {
                    fitAddon.fit();
                    post({ type: 'resize', cols: terminal.cols, rows: terminal.rows });
                } catch { }
            };

            terminal.onData(data => post({ type: 'input', data }));
            terminal.onResize(size => post({ type: 'resize', cols: size.cols, rows: size.rows }));

      window.fluentShellTerminal = {
                setTheme: (value, colors) => {
                    const theme = { ...(value === 'light' ? themes.light : themes.dark) };
                    // Accept only known theme colors; never treat saved values as CSS or HTML.
                    for (const key of Object.keys(theme)) {
                        if (colors && typeof colors[key] === 'string' && /^#[0-9a-f]{6}$/i.test(colors[key]))
                            theme[key] = colors[key];
                    }
                    terminal.options.theme = theme;
                    document.body.style.backgroundColor = theme.background;
                    document.documentElement.style.colorScheme = value === 'light' ? 'light' : 'dark';
                },
                focus: () => terminal.focus(),
                write: data => terminal.write(data || ''),
                setFontSize: size => {
                    terminal.options.fontSize = Number(size) || 14;
                    fit();
                }
            };

            window.chrome.webview.addEventListener('message', event => {
                let message = event.data;
                if (typeof message === 'string') {
                    try { message = JSON.parse(message); } catch { return; }
                }
                if (!message || typeof message.type !== 'string') return;
        if (message.type === 'write') window.fluentShellTerminal.write(message.data);
        if (message.type === 'focus') window.fluentShellTerminal.focus();
        if (message.type === 'fontSize') window.fluentShellTerminal.setFontSize(message.value);
        if (message.type === 'theme') window.fluentShellTerminal.setTheme(message.value, message.colors);
        if (message.type === 'paste') terminal.paste(message.data || '');
        if (message.type === 'search') showSearch();
        if (message.type === 'preferences' && message.value) {
            preferences = message.value;
            terminal.options.fontFamily = preferences.fontFamily + ', monospace';
            terminal.options.cursorStyle = preferences.cursorStyle;
            terminal.options.cursorBlink = preferences.cursorBlink;
            terminal.options.scrollback = preferences.scrollback;
            fit();
        }
            });

            const resizeObserver = new ResizeObserver(() => requestAnimationFrame(fit));
            resizeObserver.observe(document.getElementById('terminal'));
            requestAnimationFrame(() => {
                fit();
                terminal.focus();
                post({ type: 'ready' });
            });
        })();
    </script>
</body>
</html>
