<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="xterm.css">
    <style>
        html, body, #terminal {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #101214;
            box-sizing: border-box;
            padding: 12px;
        }

        #terminal {
            outline: none;
        }
    </style>
</head>
<body>
    <div id="terminal" aria-label="SSH 终端"></div>
    <script src="xterm.js"></script>
    <script src="addon-fit.js"></script>
    <script>
        (() => {
            const terminal = new Terminal({
                allowProposedApi: true,
                convertEol: false,
                cursorBlink: true,
                cursorStyle: 'bar',
                fontFamily: 'Cascadia Mono, Consolas, monospace',
                fontSize: 14,
                scrollback: 20000,
                theme: {
                    background: '#101214',
                    foreground: '#E6EDF3',
                    cursor: '#E6EDF3',
                    selectionBackground: 'rgba(120, 170, 255, 0.35)'
                }
            });
            const fitAddon = new FitAddon.FitAddon();
            terminal.loadAddon(fitAddon);
            terminal.open(document.getElementById('terminal'));

            const post = message => window.chrome.webview.postMessage(message);
            const fit = () => {
                try {
                    fitAddon.fit();
                    post({ type: 'resize', cols: terminal.cols, rows: terminal.rows });
                } catch { }
            };

            terminal.onData(data => post({ type: 'input', data }));
            terminal.onResize(size => post({ type: 'resize', cols: size.cols, rows: size.rows }));

            window.novaShellTerminal = {
                focus: () => terminal.focus(),
                write: data => terminal.write(data || ''),
                clear: () => terminal.clear(),
                setFontSize: size => {
                    terminal.options.fontSize = Number(size) || 14;
                    fit();
                }
            };

            window.chrome.webview.addEventListener('message', event => {
                let message = event.data;
                if (typeof message === 'string') {
                    try { message = JSON.parse(message); } catch { return; }
                }
                if (!message || typeof message.type !== 'string') return;
                if (message.type === 'write') window.novaShellTerminal.write(message.data);
                if (message.type === 'clear') window.novaShellTerminal.clear();
                if (message.type === 'focus') window.novaShellTerminal.focus();
                if (message.type === 'fontSize') window.novaShellTerminal.setFontSize(message.value);
            });

            const resizeObserver = new ResizeObserver(() => requestAnimationFrame(fit));
            resizeObserver.observe(document.getElementById('terminal'));
            requestAnimationFrame(() => {
                fit();
                terminal.focus();
                post({ type: 'ready' });
            });
        })();
    </script>
</body>
</html>
